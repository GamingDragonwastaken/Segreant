# Publishes the public site (web/) to Cloudflare Pages (segreant.pages.dev, the canonical address)
# and to GitHub Pages (the mirror; its pages name the Cloudflare address as canonical).
#
# web/ is static and self-contained: no build step, no CDN, no analytics. A merge
# to main that touches web/ (or this file) redeploys it; a manual run redeploys
# the current main. Only the web/ folder is uploaded, never the repository.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer merge waits instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Cloudflare Pages needs an API token with "Cloudflare Pages: Edit" saved as the CLOUDFLARE_API_TOKEN
  # secret; until it exists this job says so and skips, and the site is deployed by hand with
  #   npx wrangler@4.152.0 pages deploy web --project-name segreant --branch main
  # (run from outside the repo: inside it, wrangler's auto-setup rewrites package.json).
  cloudflare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret, so the Cloudflare Pages deploy is skipped."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4.152.0 pages deploy web --project-name segreant --branch main
