name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert integration checkout identity
        shell: bash
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_INTEGRATION_SHA" ]; then
            echo "expected integration checkout $EXPECTED_INTEGRATION_SHA, got $actual" >&2
            exit 1
          fi
          echo "integration checkout: $actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      # --ignore-scripts: the install itself must not execute a lifecycle script
      # belonging to any dependency (preinstall/install/postinstall), nor this
      # package's own `prepare`, which is how `npm ci` otherwise triggers a full
      # build as an install side effect. Nothing in either lockfile carries an
      # install script today; the gap was CI having no barrier against a future
      # one. `npm run build` below is that same build, invoked explicitly -- a
      # script this repository owns and reviews, never a dependency's.
      - run: npm ci --ignore-scripts
      # Explicit, even though `pretest` currently runs the full build too:
      # `pretest` has been silently narrowed to `--web` once already, and a job
      # whose dist/ depends on whichever definition it currently carries is one
      # edit away from testing a stale tree. The build count is unchanged --
      # before this, `prepare` built at install and `pretest` built again.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # A green source-tree test does not prove the published artifact can start.
  # Build the tarball, install it into a clean directory, and invoke its real
  # bin entrypoint without publishing anything.
  package-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert integration checkout identity
        shell: bash
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_INTEGRATION_SHA" ]; then
            echo "expected integration checkout $EXPECTED_INTEGRATION_SHA, got $actual" >&2
            exit 1
          fi
          echo "integration checkout: $actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      # No explicit build step here even with --ignore-scripts: the tarball is
      # produced by `npm pack` below, which runs this package's `prepack`
      # (`npm run build`) as part of that separate command, unaffected by
      # --ignore-scripts on this install.
      - run: npm ci --ignore-scripts
      - run: mkdir -p ../segreant-pack ../segreant-install
      - run: npm pack --pack-destination ../segreant-pack
      # Software bill of materials for the RUNTIME tree, from npm's own
      # generator (no dependency added to make one). The zero-runtime-dependency
      # rule is asserted against the SBOM, not against a sentence: a runtime
      # package appearing here fails the job. The SBOM is an unsigned build
      # fact; signed provenance needs `id-token: write`, which is owner-reserved.
      - name: Runtime SBOM (CycloneDX) and zero-dependency assertion
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent sbom > segreant-runtime.cdx.json
          node scripts/check-sbom.mjs segreant-runtime.cdx.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: segreant-runtime-sbom
          path: segreant-runtime.cdx.json
          if-no-files-found: error
          retention-days: 30
      - working-directory: ../segreant-install
        run: npm install --ignore-scripts --no-package-lock ../segreant-pack/segreant-*.tgz
      - working-directory: ../segreant-install
        run: ./node_modules/.bin/segreant --help
      # Prove the packed executable, compiled dashboard, static HTML, and isolated
      # synthetic ledger work together. The trial is intentionally synthetic and
      # must remain review-only — this is a package/runtime proof, not model evidence.
      - name: Packaged demo dashboard smoke
        working-directory: ../segreant-install
        shell: bash
        run: |
          set -euo pipefail
          export SEGREANT_HOME="$PWD/.segreant-home"
          ./node_modules/.bin/segreant billing scope set --account-ref ci-package-smoke --json >scope-preview.json
          ./node_modules/.bin/segreant billing scope set --account-ref ci-package-smoke --project-ref proj_ci_package --apply --json >scope-active.json
          ./node_modules/.bin/segreant billing openai-costs preview --from 2026-01-01 --to 2026-01-02 --json >costs-preview.json
          ./node_modules/.bin/segreant demo >/dev/null
          ./node_modules/.bin/segreant start --demo --port 18090 --dashboard-port 18091 >segreant-dashboard.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:18091/api/health >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent --show-error http://127.0.0.1:18091/api/health >/dev/null
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:18091';
          const overview = await (await fetch(`${base}/api/overview`)).json();
          const value = await (await fetch(`${base}/api/value`)).json();
          const billing = await (await fetch(`${base}/api/billing`)).json();
          const shell = await (await fetch(`${base}/`)).text();
          const appEntry = await fetch(`${base}/app/main.js`);
          const classic = await (await fetch(`${base}/classic`)).text();
          const scope = JSON.parse(await (await import('node:fs/promises')).readFile('scope-preview.json', 'utf8'));
          const activeScope = JSON.parse(await (await import('node:fs/promises')).readFile('scope-active.json', 'utf8'));
          const costs = JSON.parse(await (await import('node:fs/promises')).readFile('costs-preview.json', 'utf8'));
          if (overview.demo !== true || !(overview.summary?.requests > 0)) throw new Error('packaged demo overview missing labelled synthetic traffic');
          if (value.demo !== true || !Array.isArray(value.frontier?.modelSwitches) || value.frontier.modelSwitches.length === 0) throw new Error('packaged dashboard value API missing model trial');
          if (!value.frontier.modelSwitches.every((item) => item.confidence === 'trial')) throw new Error('synthetic model trial was overstated as evidence');
          if (scope.applied !== false || scope.preview?.trust !== 'operator_declared_unverified') throw new Error('packaged billing-scope preview did not preserve dry-run/unverified boundary');
          if (activeScope.applied !== true || activeScope.declaration?.providerProjectRef !== 'proj_ci_package') throw new Error('packaged scope activation did not preserve declared project provenance');
          if (costs.applied !== false || costs.networkAttempted !== false || costs.credentialRead !== false || costs.preview?.projectRef !== 'proj_ci_package') throw new Error('packaged OpenAI Costs preview lost its secret-free/no-network boundary');
          if (billing.demo !== true || billing.summary?.recordCount !== 0 || billing.evidence?.reconciliationStatus !== 'not_reconciled') throw new Error('packaged demo billing surface fabricated evidence or lost its unresolved boundary');
          // `/` is the GUI shell: an empty #app plus a module script, with every
          // figure rendered in the browser. A static fetch of it can no longer
          // observe a rendered claim, so asserting label text against `/` was
          // asserting against markup that stopped existing when the GUI landed.
          // The two things a PACKAGED artifact can actually get wrong are split
          // out instead: the shell and its compiled entry must both be in the
          // tarball and served (a shell whose module 404s is a blank dashboard),
          // and `/classic`, which still renders server-side, must still carry the
          // labelled demo / review-only trial / unreconciled claims.
          if (!shell.includes('id="app"') || !shell.includes('/app/main.js')) throw new Error('packaged GUI shell missing its mount point or module entry');
          if (!appEntry.ok || !(appEntry.headers.get('content-type') || '').includes('javascript')) throw new Error(`packaged GUI shell references /app/main.js but the tarball does not serve it (${appEntry.status})`);
          if (!classic.includes('DEMO DATA') || !classic.includes('Cheaper model trials') || !classic.includes('NOT RECONCILED')) throw new Error('packaged classic dashboard missing labelled model-trial or billing renderer');
          NODE

  # Repository-side security evidence that does not require release identity or
  # write permissions: production-source credential/dynamic-code scan, supply-
  # chain policy audit, and high-severity runtime dependency audit for both npm
  # packages. Signed release provenance remains a release-time owner gate.
  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert integration checkout identity
        shell: bash
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_INTEGRATION_SHA" ]; then
            echo "expected integration checkout $EXPECTED_INTEGRATION_SHA, got $actual" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: team-server
      - run: npm run verify:security
      - run: npm run verify:supply-chain
      - run: npm run audit:runtime

  # Runtime accessibility is a browser property, not a source-text property.
  # Keep the browser harness dev/test-only and separate from the ordinary
  # zero-runtime-dependency package surface.
  browser-accessibility:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert integration checkout identity
        shell: bash
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_INTEGRATION_SHA" ]; then
            echo "expected integration checkout $EXPECTED_INTEGRATION_SHA, got $actual" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # team-server is a genuinely separate npm package (own package.json/lockfile,
  # `pg` as its only dependency) so it gets its own job rather than being folded
  # into `test` above — same OS matrix, run in parallel, never silently skipped.
  team-server-test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: team-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert integration checkout identity
        shell: bash
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_INTEGRATION_SHA" ]; then
            echo "expected integration checkout $EXPECTED_INTEGRATION_SHA, got $actual" >&2
            exit 1
          fi
          echo "integration checkout: $actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: team-server/package-lock.json
      # team-server has no prepare/prepack of its own -- start/test/typecheck run
      # straight against source -- so there is nothing load-bearing here for
      # --ignore-scripts to skip past.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  # The team server's store is PostgreSQL in every real deployment, but the
  # matrix above runs against its in-memory double. This job runs the
  # repository's real-PostgreSQL integration test against a disposable
  # database, so signed-rollup persistence, replay identity, restart state and
  # rollback are proven on every change rather than only by hand.
  team-server-postgres:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: segreant
          POSTGRES_PASSWORD: segreant-ci-only
          POSTGRES_DB: segreant_team
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U segreant -d segreant_team"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: team-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert integration checkout identity
        shell: bash
        env:
          EXPECTED_INTEGRATION_SHA: ${{ github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_INTEGRATION_SHA" ]; then
            echo "expected integration checkout $EXPECTED_INTEGRATION_SHA, got $actual" >&2
            exit 1
          fi
          echo "integration checkout: $actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: team-server/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Real PostgreSQL integration test
        env:
          DATABASE_URL: postgres://segreant:segreant-ci-only@localhost:5432/segreant_team
        run: npm run test:postgres

  # The pull_request event's default checkout is GitHub's synthetic merge ref.
  # Keep this separate from the integration matrix and explicitly verify the
  # candidate head so a green merge-ref run cannot be misreported as head proof.
  candidate-head:
    if: github.event_name == 'pull_request'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert candidate checkout identity
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD_SHA" ]; then
            echo "expected candidate head $EXPECTED_HEAD_SHA, got $actual" >&2
            exit 1
          fi
          echo "candidate head checkout: $actual"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:security
      - run: npm run verify:supply-chain
      - run: npm audit --omit=dev --audit-level=high
      # Same reason as the `test` job: this is the run that speaks for the
      # candidate head rather than the synthetic merge ref, so it must not be
      # the one testing a stale or absent dist/.
      - run: npm run build
      - run: npm run typecheck
      - run: node ./node_modules/typescript/bin/tsc --noEmit -p src/dashboard/web/app/tsconfig.json
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: team-server
      - run: npm audit --omit=dev --audit-level=high
        working-directory: team-server
      - run: npm run typecheck
        working-directory: team-server
      - run: npm test
        working-directory: team-server
