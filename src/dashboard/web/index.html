<!--
  DIRECTION CONTRACT

  THESIS: A financial console where the basis for a number arrives in the same
  breath as the number, and where every action shows you what it will do before
  it does it. It refuses the dashboard default of tiles that assert figures and
  bury their caveats in a tooltip.

  OWN-WORLD: Night Vault, inherited. Ledger-dark ground with a warm paper light
  theme, gold as the single accent, serif display against mono quantities,
  hairline cards on a 4px rhythm. Chrome stays neutral so color can mean
  something: demo, estimate, unverified, over. No web fonts, no external request
  of any kind.

  STORY: Someone arrives asking what AI cost them. They see the figure and, on
  the same line, what it rests on. When they want to change something, a drawer
  shows the preview, names the consequence out loud, prints the equivalent
  command, and only then offers the commit.

  FIRST VIEWPORT: A fixed left rail of seven territories over a register switch.
  Spend leads with three quantities, each carrying its basis beneath it, then the
  two breakdowns that answer "where did it go". The primary action is not a
  button, it is the range chips: the first thing you do here is choose a window.

  FORM: Console with a persistent rail and a right-hand action drawer.

  FINISH: unreviewed and undocumented is unfinished; this build ends with the
  finish review, the verdict, DESIGN.md, and every shipping raster carrying its
  provenance.
-->
